name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: npm test
        run: |
          npm install
          npm test

      - name: Go tests
        run: go test ./...

      - name: Shell CLI vectors
        run: python3 scripts/run_vectors.py
